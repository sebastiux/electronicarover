; Firmware Rover Controller v1.1 - compilar con:  pio run
[platformio]
src_dir = .
default_envs = traction, servos

[common]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
build_flags = -I common -Wall
monitor_speed = 115200

[env:traction]
extends = common
build_src_filter = -<*> +<traction/src/>

[env:servos]
extends = common
build_src_filter = -<*> +<servos/src/>
